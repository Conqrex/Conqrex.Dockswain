<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dockswain mark: container-stack cargo over a server/hull base. Flat teal to
       match the desktop-widget panel theme; renders centered on #16191C. -->

  <!-- upper container row -->
  <rect x="41" y="20" width="20" height="16" rx="3" fill="#38BDF8"/>
  <rect x="67" y="20" width="20" height="16" rx="3" fill="#38BDF8"/>

  <!-- main container row (deck cargo) -->
  <rect x="28" y="40" width="20" height="16" rx="3" fill="#1F6F8B"/>
  <rect x="54" y="40" width="20" height="16" rx="3" fill="#1F6F8B"/>
  <rect x="80" y="40" width="20" height="16" rx="3" fill="#1F6F8B"/>

  <!-- server / hull racks -->
  <rect x="20" y="66" width="88" height="18" rx="5" fill="#9AA7B0" fill-opacity="0.30"/>
  <rect x="20" y="90" width="88" height="18" rx="5" fill="#9AA7B0" fill-opacity="0.30"/>

  <!-- status LEDs -->
  <circle cx="33" cy="75" r="4" fill="#5EEAD4"/>
  <circle cx="33" cy="99" r="4" fill="#38BDF8"/>

  <!-- rack vents -->
  <g fill="#CBD5F5" fill-opacity="0.55">
    <rect x="88" y="73" width="12" height="4" rx="2"/>
    <rect x="88" y="97" width="12" height="4" rx="2"/>
  </g>
</svg>
